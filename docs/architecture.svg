		.f-core { fill: hsl(212 70% 64%); }
		.s-core { stroke: hsl(212 70% 64%); }
		.f-app { fill: hsl(292 70% 64%); }
		.s-app { stroke: hsl(292 70% 64%); }
		.f-root { fill: hsl(350 70% 64%); }
		.s-root { stroke: hsl(350 70% 64%); }
	}
</style>
